name: Regression Suite

on: [push, pull_request]

jobs:
  regression_tests:
    name: Regression Tests
    runs-on: ubuntu-latest
#    runs-on: ${{ matrix.os }}
#    strategy:
#      matrix:
#        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          path: ./
  
      - name: Set Up Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.13' 
        
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt
          pip install -r ./tests/requirements.txt

      - name: Start GCS Emulator
        run: |
          docker run -d --name \
                     fake-gcs-server \
                     -p 9090:4443 \
                     fsouza/fake-gcs-server:1.47 \
                     -scheme http
          # don't start the tests until the emulator answers; if it never does,
          # show why rather than letting each GCS test retry for minutes
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/storage/v1/b > /dev/null; then
              echo "GCS emulator is up"
              exit 0
            fi
            sleep 1
          done
          echo "GCS emulator did not start"
          docker ps -a --filter name=fake-gcs-server
          docker logs fake-gcs-server
          exit 1

      - name: Run Regression Tests
        run: coverage run -m pytest --color=yes
        env:
          AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;

      - name: Check Coverage
        run: coverage report --include=mabel/* --fail-under=85 -m

      - name: "Upload coverage to Codecov"
        uses: codecov/codecov-action@v1
        with:
          fail_ci_if_error: false

  mypy:
    name: Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
  
      - name: Set Up Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.13' 

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip mypy
          pip install -r $GITHUB_WORKSPACE/tests/requirements.txt

      - name: Execute Test
        run: mypy --ignore-missing-imports --python-version 3.13 --no-strict-optional mabel